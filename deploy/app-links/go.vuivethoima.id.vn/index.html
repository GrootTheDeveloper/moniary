<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mở lời mời Moniary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
  <style>
    /* FROZEN FOUNDATION TOKENS — Moniary invite fallback */
    :root {
      --color-primary: #b85c38;
      --color-secondary: #d9a574;
      --color-accent: #4a7c59;
      --color-bg: #f1ece1;
      --color-surface: #fffcf6;
      --color-text: #211d17;
      --color-muted: #5f584f;
      --color-border: #d8cdbb;
      --font-heading: "Instrument Serif", Georgia, serif;
      --font-body: "Manrope", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --radius-xl: 34px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --shadow-style: 0 18px 50px rgba(33, 29, 23, 0.10), 0 2px 0 rgba(255, 255, 255, 0.70) inset;
      --density: spacious;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(circle at 12% 16%, rgba(224, 120, 79, 0.20), transparent 28%),
        radial-gradient(circle at 88% 10%, rgba(74, 124, 89, 0.16), transparent 30%),
        linear-gradient(145deg, var(--color-bg), #f7f1e7 62%, #efe3d4);
      color: var(--color-text);
      font-family: var(--font-body);
      display: grid;
      place-items: center;
      padding: clamp(var(--space-4), 5vw, 56px);
    }

    main {
      width: min(100%, 720px);
      display: grid;
      gap: var(--space-6);
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--color-border) 86%, white);
      border-radius: var(--radius-xl);
      background: color-mix(in srgb, var(--color-surface) 94%, white);
      box-shadow: var(--shadow-style);
      padding: clamp(var(--space-6), 6vw, 56px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 18px auto auto 18px;
      width: 76px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-secondary), var(--color-accent));
    }

    .eyebrow {
      margin: 0 0 var(--space-6);
      color: var(--color-primary);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-family: var(--font-heading);
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.035em;
    }

    .copy {
      max-width: 54ch;
      margin: var(--space-6) 0 0;
      color: var(--color-muted);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.65;
    }

    .actions {
      display: grid;
      gap: var(--space-3);
      margin-top: var(--space-8);
    }

    .button {
      min-height: 56px;
      border: 0;
      border-radius: var(--radius-md);
      background: var(--color-text);
      color: #fffaf1;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      padding: 0 var(--space-6);
      text-decoration: none;
      font-weight: 800;
      transition:
        transform 180ms cubic-bezier(0.25, 1, 0.5, 1),
        background-color 180ms cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 180ms cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 10px 24px rgba(33, 29, 23, 0.16);
    }

    .button:hover,
    .button:focus-visible {
      background: #2f281f;
      box-shadow: 0 14px 28px rgba(184, 92, 56, 0.22);
      outline: 3px solid rgba(184, 92, 56, 0.22);
      outline-offset: 3px;
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(1px) scale(0.99);
    }

    .note {
      display: grid;
      gap: var(--space-2);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-lg);
      background: rgba(255, 252, 246, 0.58);
      color: var(--color-muted);
      padding: var(--space-4);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .route {
      overflow-wrap: anywhere;
      color: var(--color-primary);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    footer {
      color: color-mix(in srgb, var(--color-muted) 82%, transparent);
      font-size: 0.86rem;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main data-ai-id="invite-fallback-shell">
    <section class="card" data-ai-id="invite-fallback-card">
      <p class="eyebrow">Moniary invite</p>
      <h1 data-ai-id="invite-fallback-title">Mở lời mời</h1>
      <p class="copy" data-ai-id="invite-fallback-copy">
        Nếu Moniary đã được cài trên điện thoại, liên kết này sẽ mở thẳng vào app.
        Nếu trình duyệt đang giữ bạn ở lại đây, hãy dùng nút bên dưới để thử mở lại.
      </p>
      <div class="actions" data-ai-id="invite-fallback-actions">
        <a id="openApp" class="button" href="moniary://groups/invite" rel="nofollow">Mở trong Moniary</a>
        <aside class="note" data-ai-id="invite-fallback-note">
          <span>Chưa cài app? Hiện Moniary chưa có trang tải công khai cho liên kết này.</span>
          <span id="routeText" class="route"></span>
        </aside>
      </div>
    </section>
    <footer data-ai-id="invite-fallback-footer">vuivethoima.id.vn · Moniary</footer>
  </main>

  <script>
    const path = window.location.pathname.replace(/^\/+/, "");
    const supported = /^(friends|groups)\/invite\/[^/]+$/.test(path);
    const deepLink = supported ? `moniary://${path}` : "moniary://groups/invite";
    const openApp = document.getElementById("openApp");
    const routeText = document.getElementById("routeText");

    openApp.href = deepLink;
    routeText.textContent = supported
      ? `Đường dẫn: ${window.location.origin}/${path}`
      : "Đường dẫn này không đúng định dạng lời mời Moniary.";
  </script>
</body>
</html>
