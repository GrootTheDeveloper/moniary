name: moniary
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.4
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  app_links: ^7.0.0
  intl: ^0.20.2
  image_picker: ^1.2.2
  flutter_image_compress: ^2.4.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.3
  home_widget: ^0.7.0
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  path: ^1.9.1
  currency_text_input_formatter: ^2.3.0
  local_auth: ^3.0.1
  csv: ^8.0.0
  file_picker: ^11.0.2
  flutter_animate: ^4.5.2
  open_filex: ^4.5.0
  share_plus: ^10.1.4
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_timezone: ^3.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  cloudflare_turnstile: ^3.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/mascot/
    - assets/mascot/generated/frames/
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Newsreader.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
